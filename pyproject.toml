[project]
name = "moneyflow"
version = "0.1.0"
description = "Multi-agent system that screens US stocks by money flow and generates daily AI research reports (LangGraph + Claude)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Khang Phan" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
agents = [
    "anthropic>=0.69",
    "langgraph>=0.2",
    "langfuse>=2.50",
]
apps = [
    "streamlit>=1.38",
    "python-telegram-bot>=21.0",
]
backtest = [
    "vectorbt>=0.26",
]

[project.scripts]
moneyflow = "moneyflow.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneyflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép ký tự tiếng Việt trong chuỗi/comment

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["moneyflow"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "langgraph.*", "langfuse.*", "anthropic.*", "vectorbt.*", "streamlit.*", "telegram.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
